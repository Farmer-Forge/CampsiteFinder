<div class="auth-page">
  <form class="auth-card" (ngSubmit)="onSubmit()">
    <div class="auth-header"><h1>Sign Up</h1></div>
    <div class="auth-body">
      @if (error()) {
        <p class="rt-error">{{ error() }}</p>
      }
      @if (submitted()) {
        <p class="rt-notice">Check your email to verify your account.</p>
      } @else {
        <input class="rt-input" type="text" placeholder="Display name" [(ngModel)]="displayName" name="displayName" required />
        <input class="rt-input" type="email" placeholder="Email" [(ngModel)]="email" name="email" required />
        <input class="rt-input" type="password" placeholder="Password" [(ngModel)]="password" name="password" required />
        <button type="submit" class="rt-btn rt-btn--cherry auth-submit">Sign Up</button>
      }
      <a class="auth-switch" routerLink="/login">Already have an account? Sign in</a>
    </div>
  </form>
</div>
