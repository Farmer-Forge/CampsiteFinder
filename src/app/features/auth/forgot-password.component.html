<div class="auth-page">
  <form class="auth-card" (ngSubmit)="onSubmit()">
    <div class="auth-header"><h1>Reset Password</h1></div>
    <div class="auth-body">
      @if (error()) {
        <p class="rt-error">{{ error() }}</p>
      }
      @if (sent()) {
        <p class="rt-notice">If an account exists for that email, we've sent a reset link. Check your inbox (and spam folder).</p>
      } @else {
        <p class="auth-help">Enter your account email and we'll send you a link to choose a new password.</p>
        <input class="rt-input" type="email" placeholder="Email" [(ngModel)]="email" name="email" required />
        <button type="submit" class="rt-btn rt-btn--cherry auth-submit" [disabled]="submitting() || email === ''">Send reset link</button>
      }
      <a class="auth-switch" routerLink="/login">Back to sign in</a>
    </div>
  </form>
</div>
